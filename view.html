<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>기도제목 보기</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module">
      import { findMyLatest, pickRandom } from "./firebase.js";

      const myEl = document.getElementById("my");
      const randomEl = document.getElementById("random");

      function render(target, title, data, emptyText) {
        target.innerHTML = "";
        const box = document.createElement("div");
        box.className = "card";
        if (!data) {
          box.innerHTML = `<strong>${title}</strong><div class="small">${emptyText}</div>`;
        } else {
          box.innerHTML = `
            <strong>${title}</strong>
            <div style="margin-top: 8px;">${data.content}</div>
            <div class="small">- ${data.author || "익명"}</div>
          `;
        }
        target.appendChild(box);
      }

      window.addEventListener("DOMContentLoaded", async () => {
        try {
          const [mine, rand] = await Promise.all([findMyLatest(), pickRandom()]);
          render(myEl, "내가 작성한 기도제목", mine, "작성한 기도제목이 없습니다.");
          render(randomEl, "내가 기도할 기도제목", rand, "아직 기도제목이 없습니다.");
        } catch (e) {
          console.error(e);
          alert("불러오기 실패");
        }
      });
    </script>
  </head>
  <body>
    <div class="main" style="max-width: 720px">
      <h2>기도제목 보기</h2>
      <p style="color: #e0e7ff; margin-bottom: 24px;">여러분의 기도제목을 확인하세요</p>
      <div id="my"></div>
      <div style="height: 20px"></div>
      <div id="random"></div>
      <div style="margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
        <a class="btn btn-secondary" href="index.html">
          <span class="btn-icon">🏠</span>
          <span class="btn-text">홈으로</span>
        </a>
        <a class="btn btn-primary" href="write.html">
          <span class="btn-icon">✍️</span>
          <span class="btn-text">새로 작성</span>
        </a>
        <a class="btn btn-accent" href="tree.html">
          <span class="btn-icon">🎄</span>
          <span class="btn-text">트리 보기</span>
        </a>
      </div>
    </div>
  </body>
</html>
