<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haneul Card : 하늘의 걸음</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- Adobe Fonts -->
  <script>
    (function(d) {
      var config = {
        kitId: 'wcb3eag',
        scriptTimeout: 3000,
        async: true
      },
      h=d.documentElement,t=setTimeout(function(){
        h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";
      },config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
      h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';
      tk.async=true;tk.onload=tk.onreadystatechange=function(){
        a=this.readyState;
        if(f||a&&a!="complete"&&a!="loaded")return;
        f=true;clearTimeout(t);
        try{Typekit.load(config)}catch(e){}
      };
      s.parentNode.insertBefore(tk,s)
    })(document);
  </script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- 메인 페이지 -->
  <div id="mainPage" class="page active">
    <div class="main-container">
      <div class="main-content">
        <h1 class="main-title">The Steps of Haneul</h1>
        <p class="main-subtitle">하늘의 걸음</p>
        <p class="bible-verse">
            선한 사람의 걸음을 여호와께서 정하시니<br>그분은 그 길을 기뻐하십니다.<br>
            <span class="bible-reference">시편 37편 23절</span>
        </p>
        <div class="menu-buttons">
          <button class="menu-button" onclick="showPage('registerPage')">등록</button>
          <button class="menu-button" onclick="showPage('avatarPage')">아바타 생성</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 등록 페이지 -->
  <div id="registerPage" class="page">
    <div class="register-container">
      <div class="register-card">
        <h2 class="register-title">팀원 등록</h2>
        <div class="input-group">
          <label class="input-label">이름</label>
          <input type="text" id="name" placeholder="이름을 입력하세요">
        </div>
        <div class="input-group">
          <label class="input-label">팀명</label>
          <input type="text" id="team" placeholder="팀명을 입력하세요">
        </div>
        <div class="input-group">
          <label class="input-label">사진</label>
          <div class="file-input-wrapper">
            <label for="photo" class="file-input-label" id="fileLabel">
              📷 사진을 선택하세요
            </label>
            <input type="file" id="photo" accept="image/*" onchange="previewImage(this)">
          </div>
          <img id="preview" class="preview-image" alt="미리보기">
        </div>
        <button class="action-button" onclick="registerEmployee()">등록하기</button>
        <button class="action-button secondary" onclick="showPage('mainPage')">돌아가기</button>
        <p id="status" class="status-message"></p>
      </div>
    </div>
  </div>

  <!-- 아바타 생성 페이지 -->
  <div id="avatarPage" class="page">
    <div class="search-container">
      <div class="search-card">
        <h2 class="register-title">아바타 생성</h2>
        <div class="input-group">
          <label class="input-label">이름</label>
          <input type="text" id="avatarName" placeholder="이름을 입력하세요">
        </div>
        <div class="input-group">
          <label class="input-label">팀명</label>
          <input type="text" id="avatarTeam" placeholder="팀명을 입력하세요">
        </div>
        <div class="memoji-customization">
          <div class="customization-tabs">
            <button class="tab-btn active" onclick="showTab('skin')">피부</button>
            <button class="tab-btn" onclick="showTab('eyes')">눈</button>
            <button class="tab-btn" onclick="showTab('mouth')">입</button>
            <button class="tab-btn" onclick="showTab('hair')">머리</button>
            <button class="tab-btn" onclick="showTab('accessories')">악세사리</button>
          </div>
          
          <div class="tab-content active" id="skin-tab">
            <div class="option-category">
              <h4>얼굴형</h4>
              <div class="option-grid">
                <div class="option-item" onclick="selectOption('face', 'round')">
                  <div class="option-preview face-round"></div>
                  <span>둥근형</span>
                </div>
                <div class="option-item" onclick="selectOption('face', 'oval')">
                  <div class="option-preview face-oval"></div>
                  <span>타원형</span>
                </div>
                <div class="option-item" onclick="selectOption('face', 'square')">
                  <div class="option-preview face-square"></div>
                  <span>각진형</span>
                </div>
              </div>
            </div>
            
            <div class="option-category">
              <h4>피부색</h4>
              <div class="color-palette">
                <div class="color-option" data-color="1" onclick="selectColor('skin', 1)" style="background: #fdbcb4;"></div>
                <div class="color-option" data-color="2" onclick="selectColor('skin', 2)" style="background: #f4c2a1;"></div>
                <div class="color-option" data-color="3" onclick="selectColor('skin', 3)" style="background: #e8a87c;"></div>
                <div class="color-option" data-color="4" onclick="selectColor('skin', 4)" style="background: #d2691e;"></div>
                <div class="color-option" data-color="5" onclick="selectColor('skin', 5)" style="background: #c68642;"></div>
                <div class="color-option" data-color="6" onclick="selectColor('skin', 6)" style="background: #8d4a3c;"></div>
              </div>
            </div>
          </div>
          
          <div class="tab-content" id="eyes-tab">
            <div class="option-category">
              <h4>눈 모양</h4>
              <div class="option-grid">
                <div class="option-item" onclick="selectOption('eyes', 'normal')">
                  <div class="option-preview eyes-normal"></div>
                  <span>일반</span>
                </div>
                <div class="option-item" onclick="selectOption('eyes', 'big')">
                  <div class="option-preview eyes-big"></div>
                  <span>큰눈</span>
                </div>
                <div class="option-item" onclick="selectOption('eyes', 'small')">
                  <div class="option-preview eyes-small"></div>
                  <span>작은눈</span>
                </div>
                <div class="option-item" onclick="selectOption('eyes', 'closed')">
                  <div class="option-preview eyes-closed"></div>
                  <span>감은눈</span>
                </div>
              </div>
            </div>
            
            <div class="option-category">
              <h4>눈썹</h4>
              <div class="option-grid">
                <div class="option-item" onclick="selectOption('eyebrows', 'normal')">
                  <div class="option-preview eyebrows-normal"></div>
                  <span>일반</span>
                </div>
                <div class="option-item" onclick="selectOption('eyebrows', 'thick')">
                  <div class="option-preview eyebrows-thick"></div>
                  <span>두꺼운</span>
                </div>
                <div class="option-item" onclick="selectOption('eyebrows', 'thin')">
                  <div class="option-preview eyebrows-thin"></div>
                  <span>얇은</span>
                </div>
              </div>
            </div>
          </div>
          
          <div class="tab-content" id="mouth-tab">
            <div class="option-category">
              <h4>입 모양</h4>
              <div class="option-grid">
                <div class="option-item" onclick="selectOption('mouth', 'smile')">
                  <div class="option-preview mouth-smile"></div>
                  <span>웃음</span>
                </div>
                <div class="option-item" onclick="selectOption('mouth', 'normal')">
                  <div class="option-preview mouth-normal"></div>
                  <span>일반</span>
                </div>
                <div class="option-item" onclick="selectOption('mouth', 'surprised')">
                  <div class="option-preview mouth-surprised"></div>
                  <span>놀람</span>
                </div>
                <div class="option-item" onclick="selectOption('mouth', 'serious')">
                  <div class="option-preview mouth-serious"></div>
                  <span>진지</span>
                </div>
              </div>
            </div>
            
            <div class="option-category">
              <h4>코</h4>
              <div class="option-grid">
                <div class="option-item" onclick="selectOption('nose', 'normal')">
                  <div class="option-preview nose-normal"></div>
                  <span>일반</span>
                </div>
                <div class="option-item" onclick="selectOption('nose', 'small')">
                  <div class="option-preview nose-small"></div>
                  <span>작은</span>
                </div>
                <div class="option-item" onclick="selectOption('nose', 'big')">
                  <div class="option-preview nose-big"></div>
                  <span>큰</span>
                </div>
              </div>
            </div>
          </div>
          
          <div class="tab-content" id="hair-tab">
            <div class="option-category">
              <h4>머리스타일</h4>
              <div class="option-grid">
                <div class="option-item" onclick="selectOption('hair', 'short')">
                  <div class="option-preview hair-short"></div>
                  <span>짧은머리</span>
                </div>
                <div class="option-item" onclick="selectOption('hair', 'long')">
                  <div class="option-preview hair-long"></div>
                  <span>긴머리</span>
                </div>
                <div class="option-item" onclick="selectOption('hair', 'curly')">
                  <div class="option-preview hair-curly"></div>
                  <span>곱슬머리</span>
                </div>
                <div class="option-item" onclick="selectOption('hair', 'bald')">
                  <div class="option-preview hair-bald"></div>
                  <span>대머리</span>
                </div>
                <div class="option-item" onclick="selectOption('hair', 'bob')">
                  <div class="option-preview hair-bob"></div>
                  <span>보브컷</span>
                </div>
                <div class="option-item" onclick="selectOption('hair', 'pixie')">
                  <div class="option-preview hair-pixie"></div>
                  <span>픽시컷</span>
                </div>
              </div>
            </div>
            
            <div class="option-category">
              <h4>머리색</h4>
              <div class="color-palette">
                <div class="color-option" data-color="1" onclick="selectColor('hair', 1)" style="background: #8b4513;"></div>
                <div class="color-option" data-color="2" onclick="selectColor('hair', 2)" style="background: #654321;"></div>
                <div class="color-option" data-color="3" onclick="selectColor('hair', 3)" style="background: #a0522d;"></div>
                <div class="color-option" data-color="4" onclick="selectColor('hair', 4)" style="background: #000000;"></div>
                <div class="color-option" data-color="5" onclick="selectColor('hair', 5)" style="background: #ffffff; border: 1px solid #ccc;"></div>
                <div class="color-option" data-color="6" onclick="selectColor('hair', 6)" style="background: #ffd700;"></div>
                <div class="color-option" data-color="7" onclick="selectColor('hair', 7)" style="background: #ff69b4;"></div>
                <div class="color-option" data-color="8" onclick="selectColor('hair', 8)" style="background: #4169e1;"></div>
              </div>
            </div>
          </div>
          
          <div class="tab-content" id="accessories-tab">
            <div class="option-category">
              <h4>안경</h4>
              <div class="option-grid">
                <div class="option-item" onclick="selectOption('glasses', 'none')">
                  <div class="option-preview glasses-none"></div>
                  <span>없음</span>
                </div>
                <div class="option-item" onclick="selectOption('glasses', 'round')">
                  <div class="option-preview glasses-round"></div>
                  <span>둥근안경</span>
                </div>
                <div class="option-item" onclick="selectOption('glasses', 'square')">
                  <div class="option-preview glasses-square"></div>
                  <span>사각안경</span>
                </div>
                <div class="option-item" onclick="selectOption('glasses', 'sunglasses')">
                  <div class="option-preview glasses-sunglasses"></div>
                  <span>선글라스</span>
                </div>
              </div>
            </div>
            
            <div class="option-category">
              <h4>수염</h4>
              <div class="option-grid">
                <div class="option-item" onclick="selectOption('beard', 'none')">
                  <div class="option-preview beard-none"></div>
                  <span>없음</span>
                </div>
                <div class="option-item" onclick="selectOption('beard', 'mustache')">
                  <div class="option-preview beard-mustache"></div>
                  <span>콧수염</span>
                </div>
                <div class="option-item" onclick="selectOption('beard', 'full')">
                  <div class="option-preview beard-full"></div>
                  <span>턱수염</span>
                </div>
                <div class="option-item" onclick="selectOption('beard', 'goatee')">
                  <div class="option-preview beard-goatee"></div>
                  <span>염소수염</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <div class="character-preview-container">
          <div class="character-preview" id="characterPreview">
            <div class="character-placeholder">캐릭터 미리보기</div>
          </div>
        </div>
        <button class="action-button" onclick="generateAvatar()">아바타 생성</button>
        <button class="action-button secondary" onclick="showPage('mainPage')">돌아가기</button>
        <p id="avatarStatus" class="status-message"></p>
      </div>
    </div>
  </div>

  <!-- 결과 페이지 -->
  <div id="resultPage" class="page">
    <div class="result-container" id="resultContainer">
      <div class="card-title">The Steps of Haneul</div>
      <div class="result-card" id="resultCard">
        <img id="resultPhoto" class="employee-photo" src="" alt="사원 사진">
        <div class="employee-name" id="resultName"></div>
        <div class="employee-team" id="resultTeam"></div>
        <div class="employee-id" id="resultId"></div>
      </div>
      <div class="button-container">
        <button class="result-button" onclick="saveAsImage()">이미지 저장</button>
        <button class="result-button" onclick="showPage('avatarPage')">아바타 생성</button>
        <button class="result-button" onclick="showPage('mainPage')">메인으로</button>
      </div>
    </div>
  </div>


  <!-- JavaScript -->
  <script src="js/data.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
