<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사원증 등록 및 조회</title>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f5f7f7;
      margin: 0;
      padding: 40px;
      text-align: center;
    }
    h1 { color: #0c443b; }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 30px;
    }
    input, button {
      width: 90%;
      margin: 10px 0;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    button {
      background: #0c443b;
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover { background: #0f5a4f; }
    img {
      max-width: 150px;
      border-radius: 10px;
      margin-top: 20px;
    }
    .card {
      margin-top: 30px;
      border: 1px solid #ccc;
      border-radius: 15px;
      padding: 20px;
      background: #fafafa;
    }
  </style>
</head>
<body>

  <h1>사원증 등록</h1>
  <div class="container">
    <input type="text" id="name" placeholder="이름">
    <input type="text" id="team" placeholder="팀명">
    <input type="file" id="photo" accept="image/*">
    <button id="uploadBtn">등록하기</button>
    <p id="status"></p>
  </div>

  <h1>사원증 조회</h1>
  <div class="container">
    <input type="text" id="searchName" placeholder="이름으로 조회">
    <input type="text" id="searchTeam" placeholder="팀명으로 조회">
    <button id="searchBtn">조회하기</button>
    <div id="result"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getDatabase, ref, push, get, child } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

    // ✅ Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyCXaqnaoQYWZGywi_PPRohGaAJj_dBVDK0",
      authDomain: "haneulcard.firebaseapp.com",
      databaseURL: "https://haneulcard-default-rtdb.firebaseio.com",
      projectId: "haneulcard",
      storageBucket: "haneulcard.appspot.com",
      messagingSenderId: "814685525921",
      appId: "1:814685525921:web:eacd7b62ca15e983875de0"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const scriptURL = "https://script.google.com/macros/s/AKfycbw6ONYzMtPA5n709KSYL83Ck24R560gj3nuEORIxtea9MW2GdCNdpCVJO-6z4tHtItl/exec";

    // ✅ 등록 버튼 이벤트
    document.getElementById("uploadBtn").onclick = async () => {
      const name = document.getElementById("name").value.trim();
      const team = document.getElementById("team").value.trim();
      const file = document.getElementById("photo").files[0];
      const status = document.getElementById("status");

      if (!name || !team || !file) return alert("모든 항목을 입력해주세요!");

      status.textContent = "📤 업로드 중...";

      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64 = reader.result.split(",")[1];
        const res = await fetch(scriptURL, {
          method: "POST",
          body: new URLSearchParams({
            file: base64,
            filename: file.name,
            mimeType: file.type
          })
        });

        const imageURL = await res.text();
        if (imageURL.startsWith("ERROR")) {
          status.textContent = "❌ 업로드 실패: " + imageURL;
          return;
        }

        await push(ref(db, "employees"), {
          name,
          team,
          photoURL: imageURL,
          createdAt: new Date().toISOString()
        });

        status.innerHTML = `✅ 등록 완료!<br><a href="${imageURL}" target="_blank">이미지 보기</a>`;
        document.getElementById("name").value = "";
        document.getElementById("team").value = "";
        document.getElementById("photo").value = "";
      };
      reader.readAsDataURL(file);
    };

    // ✅ 조회 기능
    document.getElementById("searchBtn").onclick = async () => {
      const name = document.getElementById("searchName").value.trim();
      const team = document.getElementById("searchTeam").value.trim();
      const resultDiv = document.getElementById("result");

      if (!name || !team) return alert("이름과 팀을 모두 입력하세요.");

      resultDiv.innerHTML = "🔍 조회 중...";

      const snapshot = await get(child(ref(db), "employees"));
      if (snapshot.exists()) {
        const employees = snapshot.val();
        let found = false;

        for (const key in employees) {
          const emp = employees[key];
          if (emp.name === name && emp.team === team) {
            resultDiv.innerHTML = `
              <div class="card">
                <img src="${emp.photoURL}" alt="사원증 사진">
                <p><b>${emp.name}</b> / ${emp.team}</p>
              </div>`;
            found = true;
            break;
          }
        }

        if (!found) resultDiv.textContent = "❌ 해당 직원 정보를 찾을 수 없습니다.";
      } else {
        resultDiv.textContent = "등록된 직원이 없습니다.";
      }
    };
  </script>
</body>
</html>
