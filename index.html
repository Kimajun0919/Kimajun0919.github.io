<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Steps of Haneul : 하늘의 걸음</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- Adobe Fonts (optional) -->
  <script>
    (function(d) {
      var config = { kitId: 'wcb3eag', scriptTimeout: 3000, async: true },
      h=d.documentElement,t=setTimeout(function(){ h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive"; },config.scriptTimeout),
      tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
      h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';
      tk.async=true;tk.onload=tk.onreadystatechange=function(){ a=this.readyState; if(f||a&&a!="complete"&&a!="loaded")return; f=true;clearTimeout(t); try{Typekit.load(config)}catch(e){} };
      s.parentNode.insertBefore(tk,s)
    })(document);
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- 메인 페이지 -->
  <div id="mainPage" class="page active">
        <div class="main-container">
            <div class="main-content">
                <h1 class="main-title">The Steps of Haneul</h1>
                <p class="main-subtitle">하늘의 걸음 그리고 섬김</p>
                <p class="bible-verse">
                  선한 사람의 걸음을 여호와께서 정하시니<br>그분은 그 길을 기뻐하십니다.<br>
                  <span class="bible-reference">시편 37편 23절</span>
              </p>
                <div class="menu-buttons">
                    <button class="menu-button" onclick="showPage('avatarPage')">아바타 생성</button>
                    <button class="menu-button" onclick="showPage('searchPage')">조회</button>
                </div>
            </div>
        </div>
    </div>


  <!-- 아바타 생성 페이지 -->
  <div id="avatarPage" class="page">
    <div class="search-container">
      <div class="search-card">
      <div class="avatar-builder-header">
        <h2>아바타 생성</h2>
        <!-- 헤더 액션 제거: 저장/뒤로는 아래 폼에 배치 -->
      </div>
      
      <!-- 아바타 저장 폼 -->
      <div class="avatar-save-form">
        <h3>아바타 저장</h3>
        <div class="form-group">
          <input type="text" id="avatarName" placeholder="이름을 입력하세요" class="form-input">
          <input type="text" id="avatarTeam" placeholder="팀명을 입력하세요" class="form-input">
        </div>
        <div class="form-actions">
          <button onclick="saveAvatar()" class="btn btn-primary">저장</button>
          <button onclick="showPage('mainPage')" class="btn btn-secondary">뒤로가기</button>
        </div>
        <div id="avatarStatus" class="status-message"></div>
      </div>

      <div class="main-grid">
        <!-- 미리보기 패널 -->
        <div class="preview-panel preview-sticky">
          <h3>미리보기</h3>
          <svg id="avatarPreview" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <!-- SVG 정의부 -->
            <defs id="assetDefs"></defs>
            
            <!-- 레이어 순서대로 렌더링 -->
            <g data-part="faceShape"></g>
            <g data-part="ears"></g>
            <g data-part="skinTone"></g>
            <g data-part="hairBack"></g>
            <g data-part="eyebrows"></g>
            <g data-part="eyes"></g>
            <g data-part="nose"></g>
            <g data-part="mouth"></g>
            <g data-part="top"></g>
            <g data-part="hair"></g>
          </svg>
          
          <div class="export-options">
            <label>
              <input type="checkbox" id="transparentBg" checked>
              투명 배경
            </label>
          </div>
        </div>

        <!-- 편집 패널 -->
        <div class="editor-panel editor-scroll">
          <!-- 얼굴형 -->
          <div class="part-section">
            <div class="part-title">👤 얼굴형</div>
            <div class="options-grid" id="faceShapeOptions"></div>
          </div>

          <!-- 피부색 -->
          <div class="part-section">
            <div class="part-title">🎨 피부색</div>
            <div class="color-palette" id="skinToneOptions"></div>
          </div>

          <!-- 머리스타일 -->
          <div class="part-section">
            <div class="part-title">💇 머리스타일</div>
            <div class="options-grid" id="hairOptions"></div>
            <div class="color-palette" id="hairColorOptions"></div>
            <div class="control-group">
              <button class="btn btn-secondary" onclick="randomizePart('hair')">🎲 무작위</button>
            </div>
          </div>

          <!-- 눈 -->
          <div class="part-section">
            <div class="part-title">👁️ 눈</div>
            <div class="options-grid" id="eyesOptions"></div>
            <div class="color-palette" id="eyesColorOptions"></div>
          </div>

          <!-- 눈썹 -->
          <div class="part-section">
            <div class="part-title">✨ 눈썹</div>
            <div class="options-grid" id="eyebrowsOptions"></div>
            <div class="color-palette" id="eyebrowsColorOptions"></div>
          </div>

          <!-- 코 -->
          <div class="part-section">
            <div class="part-title">👃 코</div>
            <div class="options-grid" id="noseOptions"></div>
          </div>

          <!-- 입 -->
          <div class="part-section">
            <div class="part-title">👄 입</div>
            <div class="options-grid" id="mouthOptions"></div>
            <div class="color-palette" id="mouthColorOptions"></div>
          </div>

          <!-- 귀 -->
          <div class="part-section">
            <div class="part-title">👂 귀</div>
            <div class="options-grid" id="earsOptions"></div>
          </div>

          <!-- 상의 -->
          <div class="part-section">
            <div class="part-title">👕 상의</div>
            <div class="options-grid" id="topOptions"></div>
            <div class="color-palette" id="topColorOptions"></div>
          </div>

          
        </div>
      </div>
      </div>
    </div>
  </div>

  <!-- 조회 페이지 -->
  <div id="searchPage" class="page">
    <div class="search-container">
      <div class="search-card">
        <h2>직원 조회</h2>
        <div class="search-form">
          <div class="input-group">
            <label for="searchName">이름</label>
            <input type="text" id="searchName" placeholder="이름을 입력하세요">
          </div>
          <div class="input-group">
            <label for="searchTeam">팀명</label>
            <input type="text" id="searchTeam" placeholder="팀명을 입력하세요">
          </div>
          <button class="action-button" onclick="searchEmployee()">검색</button>
        </div>
        <div id="searchResults" class="search-results"></div>
        <div id="searchStatus" class="status-message"></div>
        <div class="back-button">
          <button class="action-button secondary" onclick="showPage('mainPage')">← 메인으로</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 결과 페이지 -->
  <div id="resultPage" class="page">
    <div class="result-container">
      <div class="result-card" id="resultCard">
        <div class="employee-photo" id="resultPhoto">
          <!-- 아바타가 여기에 표시됩니다 -->
        </div>
        <div class="employee-name" id="resultName"></div>
        <div class="employee-team" id="resultTeam"></div>
        <div class="employee-id" id="resultId"></div>
      </div>
      <div class="button-container">
        <button class="result-button" onclick="saveAsImage()">이미지로 저장</button>
        <button class="result-button" onclick="showPage('searchPage')">다시 검색</button>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="js/data.js"></script>
  <script type="module" src="js/assets.js"></script>
  <script src="js/avatar-builder.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
