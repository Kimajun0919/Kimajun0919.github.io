<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>AR 전시관</title>
    <!-- A-Frame 불러오기 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js 불러오기 (카메라 + AR 기능) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- AR.js 씬 -->
    <a-scene embedded arjs>
      <!-- 현실 카메라가 배경으로 뜸 -->

      <!-- 작품 1: 이미지 -->
      <a-image src="image1.jpeg" position="0 1.5 -2" width="1.5" height="1"></a-image>
      <a-text value="케냐 (몸바사)" position="0 1 -2" align="center" color="#fff"></a-text>

      <!-- 작품 2: 이미지 -->
      <a-image src="image2.jpeg" position="2 1.5 -3" width="1.5" height="1"></a-image>
      <a-text value="베트남 (하노이)" position="2 1 -3" align="center" color="#fff"></a-text>

      <!-- 작품 3: 이미지 -->
      <a-image src="image3.jpeg" position="-2 1.5 -3" width="1.5" height="1"></a-image>
      <a-text value="일본 (교토)" position="-2 1 -3" align="center" color="#fff"></a-text>

      <!-- 조명 효과 -->
      <a-light type="ambient" intensity="1"></a-light>
    </a-scene>
  </body>
</html>
