<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하늘의 걸음</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Adobe Fonts -->
    <script>
        (function(d) {
            var config = {
                kitId: 'wcb3eag',
                scriptTimeout: 3000,
                async: true
            },
            h=d.documentElement,t=setTimeout(function(){
                h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";
            },config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
            h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';
            tk.async=true;tk.onload=tk.onreadystatechange=function(){
                a=this.readyState;
                if(f||a&&a!="complete"&&a!="loaded")return;
                f=true;clearTimeout(t);
                try{Typekit.load(config)}catch(e){}
            };
            s.parentNode.insertBefore(tk,s)
        })(document);
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif KR', serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* 메인 페이지 */
        .main-container {
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(93, 201, 190, 0.1) 0%, rgba(12, 68, 59, 0.1) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .main-content {
            text-align: center;
            z-index: 10;
            position: relative;
            padding: 40px 20px;
        }

        .main-title {
            font-family: "flirt-script-regular", sans-serif;
            font-size: clamp(36px, 8vw, 72px);
            color: rgba(12, 68, 59, 1);
            font-weight: 400;
            font-style: normal;
            margin-bottom: 20px;
            letter-spacing: 2px;
            line-height: 1.2;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        .main-subtitle {
            font-family: "grandiflora-one", "Noto Serif KR", serif;
            font-size: clamp(30px, 3vw, 42px);
            color: rgba(12, 68, 59, 1);
            font-weight: 300;
            letter-spacing: clamp(2px, 1vw, 8px);
            margin-top: 30px;
        }

        .start-button {
            margin-top: 60px;
            padding: 18px 50px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(12, 68, 59, 0.4);
            color: rgba(12, 68, 59, 1);
            font-size: clamp(16px, 2vw, 18px);
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-family: 'Noto Serif KR', serif;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .start-button:hover {
            background: rgba(12, 68, 59, 0.12);
            border-color: rgba(12, 68, 59, 0.6);
            color: rgba(12, 68, 59, 1);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(12, 68, 59, 0.18);
        }

        /* 등록 페이지 */
        .register-container {
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(93, 201, 190, 0.1) 0%, rgba(12, 68, 59, 0.1) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .form-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: clamp(30px, 5vw, 60px) clamp(25px, 4vw, 50px);
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            position: relative;
            z-index: 10;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-title {
            font-family: "grandiflora-one", "Noto Serif KR", serif;
            font-size: clamp(24px, 3vw, 32px);
            color: rgba(12, 68, 59, 1);
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .form-subtitle {
            font-size: clamp(14px, 2vw, 16px);
            color: #666;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 400;
            color: rgba(12, 68, 59, 1);
            font-size: clamp(14px, 2vw, 16px);
            letter-spacing: 1px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid rgba(12, 68, 59, 0.2);
            border-radius: 15px;
            font-size: clamp(14px, 2vw, 16px);
            font-family: 'Noto Serif KR', serif;
            background: rgba(255,255,255,0.8);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: rgba(12, 68, 59, 0.6);
            background: rgba(255,255,255,1);
        }

        input[type="file"] {
            padding: 12px 15px;
        }

        .preview-container {
            margin-top: 20px;
            text-align: center;
        }

        .preview-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: rgba(255,255,255,0.3);
            border: 2px solid rgba(12, 68, 59, 0.4);
            color: rgba(12, 68, 59, 1);
            font-size: clamp(16px, 2vw, 18px);
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-family: 'Noto Serif KR', serif;
            font-weight: 300;
            letter-spacing: 2px;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background: rgba(12, 68, 59, 0.12);
            border-color: rgba(12, 68, 59, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(12, 68, 59, 0.18);
        }

        /* 조회 페이지 */
        .view-container {
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(93, 201, 190, 0.1) 0%, rgba(12, 68, 59, 0.1) 100%);
            padding: 60px 20px;
        }

        .view-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .view-title {
            font-family: "grandiflora-one", "Noto Serif KR", serif;
            font-size: clamp(28px, 4vw, 42px);
            color: rgba(12, 68, 59, 1);
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        .view-subtitle {
            font-size: clamp(14px, 2vw, 16px);
            color: #666;
            font-weight: 300;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 사원증 카드 */
        .employee-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            transition: all 0.4s ease;
        }

        .employee-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .card-header {
            background: linear-gradient(135deg, rgba(93, 201, 190, 0.8) 0%, rgba(12, 68, 59, 0.9) 100%);
            padding: 25px;
            text-align: center;
        }

        .card-header-title {
            font-family: "grandiflora-one", "Noto Serif KR", serif;
            font-size: 18px;
            color: white;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .card-header-subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.9);
            font-weight: 300;
            letter-spacing: 2px;
        }

        .card-body {
            padding: 40px 30px;
            text-align: center;
        }

        .employee-photo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 25px;
            border: 4px solid rgba(12, 68, 59, 0.2);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .employee-info {
            margin-top: 25px;
        }

        .info-item {
            background: rgba(12, 68, 59, 0.05);
            padding: 15px;
            margin: 12px 0;
            border-radius: 15px;
            font-size: clamp(14px, 2vw, 16px);
        }

        .info-label {
            font-weight: 400;
            color: rgba(12, 68, 59, 1);
            margin-right: 10px;
            letter-spacing: 1px;
        }

        .info-value {
            font-weight: 300;
            color: #333;
        }

        .back-button {
            position: fixed;
            top: 30px;
            left: 30px;
            padding: 12px 30px;
            background: rgba(255,255,255,0.3);
            border: 2px solid rgba(12, 68, 59, 0.4);
            color: rgba(12, 68, 59, 1);
            font-size: 14px;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-family: 'Noto Serif KR', serif;
            font-weight: 300;
            letter-spacing: 1px;
            z-index: 100;
        }

        .back-button:hover {
            background: rgba(12, 68, 59, 0.12);
            border-color: rgba(12, 68, 59, 0.6);
            transform: translateY(-2px);
        }

        .message {
            text-align: center;
            padding: 15px;
            margin: 20px 0;
            border-radius: 15px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .success {
            background: rgba(93, 201, 190, 0.2);
            color: rgba(12, 68, 59, 1);
            border: 2px solid rgba(93, 201, 190, 0.4);
        }

        .error {
            background: rgba(220, 53, 69, 0.1);
            color: #721c24;
            border: 2px solid rgba(220, 53, 69, 0.3);
        }

        .loading {
            text-align: center;
            color: rgba(12, 68, 59, 1);
            font-size: 18px;
            margin: 60px 0;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .no-data {
            text-align: center;
            color: rgba(12, 68, 59, 1);
            font-size: 18px;
            margin: 100px 0;
            background: rgba(255,255,255,0.3);
            padding: 50px;
            border-radius: 25px;
            font-weight: 300;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }

            .back-button {
                top: 20px;
                left: 20px;
                padding: 10px 20px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .form-card {
                padding: 30px 20px;
                border-radius: 20px;
                width: 95%;
            }

            .employee-card {
                border-radius: 20px;
            }

            .card-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 메인 페이지 -->
    <div id="mainPage" class="page active">
        <div class="main-container">
            <div class="main-content">
                <h1 class="main-title">Employee ID System</h1>
                <p class="main-subtitle">사원증 관리 시스템</p>
                <button class="start-button" onclick="showRegister()">등록하기</button>
                <button class="start-button" onclick="showView()" style="margin-left: 20px;">조회하기</button>
            </div>
        </div>
    </div>

    <!-- 등록 페이지 -->
    <div id="registerPage" class="page">
        <div class="register-container">
            <button class="back-button" onclick="showMain()">← 돌아가기</button>
            <div class="form-card">
                <div class="form-header">
                    <h2 class="form-title">직원 등록</h2>
                    <p class="form-subtitle">새로운 직원 정보를 등록합니다</p>
                </div>
                <form id="employeeForm">
                    <div class="form-group">
                        <label for="name">이름</label>
                        <input type="text" id="name" required placeholder="이름을 입력하세요">
                    </div>
                    <div class="form-group">
                        <label for="team">팀</label>
                        <input type="text" id="team" required placeholder="팀명을 입력하세요">
                    </div>
                    <div class="form-group">
                        <label for="photo">사진</label>
                        <input type="file" id="photo" accept="image/*" required>
                    </div>
                    <div class="preview-container" id="previewContainer" style="display: none;">
                        <img id="previewImage" class="preview-image" alt="미리보기">
                    </div>
                    <button type="submit" class="submit-btn">등록하기</button>
                </form>
                <div id="message"></div>
            </div>
        </div>
    </div>

    <!-- 조회 페이지 -->
    <div id="viewPage" class="page">
        <div class="view-container">
            <button class="back-button" onclick="showMain()">← 돌아가기</button>
            <div class="view-header">
                <h2 class="view-title">사원증 조회</h2>
                <p class="view-subtitle">등록된 직원 목록입니다</p>
            </div>
            <div id="cardsContainer"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // Firebase 설정 (여기에 본인의 Firebase 설정을 입력하세요)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // 페이지 전환 함수들
        window.showMain = function() {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('mainPage').classList.add('active');
        };

        window.showRegister = function() {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('registerPage').classList.add('active');
        };

        window.showView = function() {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('viewPage').classList.add('active');
            loadEmployees();
        };

        // 이미지 미리보기
        document.getElementById('photo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImage').src = e.target.result;
                    document.getElementById('previewContainer').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // 폼 제출
        document.getElementById('employeeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const team = document.getElementById('team').value;
            const photoFile = document.getElementById('photo').files[0];
            
            if (!photoFile) {
                showMessage('사진을 선택해주세요.', 'error');
                return;
            }

            try {
                // 이미지를 Base64로 변환
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const photoData = e.target.result;
                    
                    // Firebase에 데이터 저장
                    const employeesRef = ref(database, 'employees');
                    await push(employeesRef, {
                        name: name,
                        team: team,
                        photo: photoData,
                        createdAt: new Date().toISOString()
                    });
                    
                    showMessage('직원이 성공적으로 등록되었습니다!', 'success');
                    
                    // 폼 리셋
                    document.getElementById('employeeForm').reset();
                    document.getElementById('previewContainer').style.display = 'none';
                };
                reader.readAsDataURL(photoFile);
                
            } catch (error) {
                console.error('Error:', error);
                showMessage('등록 중 오류가 발생했습니다.', 'error');
            }
        });

        // 직원 목록 로드
        function loadEmployees() {
            const cardsContainer = document.getElementById('cardsContainer');
            cardsContainer.innerHTML = '<div class="loading">데이터를 불러오는 중...</div>';
            
            const employeesRef = ref(database, 'employees');
            onValue(employeesRef, (snapshot) => {
                const data = snapshot.val();
                cardsContainer.innerHTML = '';
                
                if (data) {
                    const cardsGrid = document.createElement('div');
                    cardsGrid.className = 'cards-grid';
                    
                    Object.keys(data).forEach(key => {
                        const employee = data[key];
                        const card = createEmployeeCard(employee);
                        cardsGrid.appendChild(card);
                    });
                    
                    cardsContainer.appendChild(cardsGrid);
                } else {
                    cardsContainer.innerHTML = '<div class="no-data">등록된 직원이 없습니다.</div>';
                }
            });
        }

        // 사원증 카드 생성
        function createEmployeeCard(employee) {
            const card = document.createElement('div');
            card.className = 'employee-card';
            
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-header-title">EMPLOYEE ID CARD</div>
                    <div class="card-header-subtitle">직원증</div>
                </div>
                <div class="card-body">
                    <img src="${employee.photo}" alt="${employee.name}" class="employee-photo">
                    <div class="employee-info">
                        <div class="info-item">
                            <span class="info-label">이름</span>
                            <span class="info-value">${employee.name}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">소속</span>
                            <span class="info-value">${employee.team}</span>
                        </div>
                    </div>
                </div>
            `;
            
            return card;
        }

        // 메시지 표시
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
