<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀원 관리 시스템</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- Adobe Fonts (optional) -->
  <script>
    (function(d) {
      var config = { kitId: 'wcb3eag', scriptTimeout: 3000, async: true },
      h=d.documentElement,t=setTimeout(function(){ h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive"; },config.scriptTimeout),
      tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
      h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';
      tk.async=true;tk.onload=tk.onreadystatechange=function(){ a=this.readyState; if(f||a&&a!="complete"&&a!="loaded")return; f=true;clearTimeout(t); try{Typekit.load(config)}catch(e){} };
      s.parentNode.insertBefore(tk,s)
    })(document);
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- 메인 페이지 -->
  <div id="mainPage" class="page active">
        <div class="main-container">
            <div class="main-content">
                <h1 class="main-title">팀원 관리 시스템</h1>
                <p class="main-subtitle">아바타 생성 · 팀원 조회</p>
                <div class="menu-buttons">
                    <button class="menu-button" onclick="showPage('avatarPage')">아바타 생성</button>
                    <button class="menu-button" onclick="showPage('searchPage')">조회</button>
                </div>
            </div>
        </div>
    </div>


  <!-- 아바타 생성 페이지 -->
  <div id="avatarPage" class="page">
    <div class="container">
      <h2>아바타 생성</h2>
      <div class="avatar-generator">
        <div class="avatar-preview">
          <div id="avatarContainer"></div>
          <div class="avatar-controls">
            <button class="btn-primary" onclick="randomizeAvatar()">랜덤 생성</button>
            <button class="btn-secondary" onclick="downloadAvatar('png')">PNG 다운로드</button>
            <button class="btn-secondary" onclick="downloadAvatar('svg')">SVG 다운로드</button>
          </div>
        </div>
        <div class="avatar-options">
          <div class="option-group">
            <label for="avatarStyle">아바타 스타일</label>
            <select id="avatarStyle" onchange="updateAvatar()">
              <option value="Circle">원형</option>
              <option value="Transparent">투명</option>
            </select>
          </div>
          <div class="option-group">
            <label for="topType">머리 스타일</label>
            <select id="topType" onchange="updateAvatar()">
              <option value="NoHair">대머리</option>
              <option value="Eyepatch">안대</option>
              <option value="Hat">모자</option>
              <option value="Hijab">히잡</option>
              <option value="Turban">터번</option>
              <option value="WinterHat1">겨울모자1</option>
              <option value="WinterHat2">겨울모자2</option>
              <option value="WinterHat3">겨울모자3</option>
              <option value="WinterHat4">겨울모자4</option>
              <option value="LongHairBigHair">긴 머리</option>
              <option value="LongHairBob">단발</option>
              <option value="LongHairBun">똥머리</option>
              <option value="LongHairCurly">곱슬머리</option>
              <option value="LongHairCurvy">웨이브</option>
              <option value="LongHairDreads">드레드</option>
              <option value="LongHairFrida">프리다</option>
              <option value="LongHairFro">아프로</option>
              <option value="LongHairFroBand">아프로 밴드</option>
              <option value="LongHairNotTooLong">중간 길이</option>
              <option value="LongHairShavedSides">사이드 삭발</option>
              <option value="LongHairMiaWallace">미아 월리스</option>
              <option value="LongHairStraight">스트레이트</option>
              <option value="LongHairStraight2">스트레이트2</option>
              <option value="LongHairStraightStrand">스트레이트 가닥</option>
              <option value="ShortHairDreads01">짧은 드레드</option>
              <option value="ShortHairDreads02">짧은 드레드2</option>
              <option value="ShortHairFrizzle">곱슬</option>
              <option value="ShortHairShaggyMullet">멀렛</option>
              <option value="ShortHairShortCurly">짧은 곱슬</option>
              <option value="ShortHairShortFlat">짧은 플랫</option>
              <option value="ShortHairShortRound">짧은 라운드</option>
              <option value="ShortHairShortWaved">짧은 웨이브</option>
              <option value="ShortHairSides">사이드</option>
              <option value="ShortHairTheCaesar">시저</option>
              <option value="ShortHairTheCaesarSidePart">시저 사이드</option>
            </select>
          </div>
          <div class="option-group">
            <label for="accessoriesType">액세서리</label>
            <select id="accessoriesType" onchange="updateAvatar()">
              <option value="Blank">없음</option>
              <option value="Kurt">커트</option>
              <option value="Prescription01">안경1</option>
              <option value="Prescription02">안경2</option>
              <option value="Round">둥근 안경</option>
              <option value="Sunglasses">선글라스</option>
              <option value="Wayfarers">웨이파레</option>
            </select>
          </div>
          <div class="option-group">
            <label for="hairColor">머리색</label>
            <select id="hairColor" onchange="updateAvatar()">
              <option value="Auburn">적갈색</option>
              <option value="Black">검은색</option>
              <option value="Blonde">금발</option>
              <option value="BlondeGolden">골든 블론드</option>
              <option value="Brown">갈색</option>
              <option value="BrownDark">진한 갈색</option>
              <option value="PastelPink">파스텔 핑크</option>
              <option value="Platinum">플래티넘</option>
              <option value="Red">빨간색</option>
              <option value="SilverGray">은회색</option>
            </select>
          </div>
          <div class="option-group">
            <label for="facialHairType">수염</label>
            <select id="facialHairType" onchange="updateAvatar()">
              <option value="Blank">없음</option>
              <option value="BeardMedium">중간 수염</option>
              <option value="BeardLight">가벼운 수염</option>
              <option value="BeardMagestic">위엄있는 수염</option>
              <option value="MoustacheFancy">화려한 콧수염</option>
              <option value="MoustacheMagnum">마그넘 콧수염</option>
            </select>
          </div>
          <div class="option-group">
            <label for="facialHairColor">수염색</label>
            <select id="facialHairColor" onchange="updateAvatar()">
              <option value="Auburn">적갈색</option>
              <option value="Black">검은색</option>
              <option value="Blonde">금발</option>
              <option value="BlondeGolden">골든 블론드</option>
              <option value="Brown">갈색</option>
              <option value="BrownDark">진한 갈색</option>
              <option value="Platinum">플래티넘</option>
              <option value="Red">빨간색</option>
            </select>
          </div>
          <div class="option-group">
            <label for="clotheType">옷</label>
            <select id="clotheType" onchange="updateAvatar()">
              <option value="BlazerShirt">블레이저 셔츠</option>
              <option value="BlazerSweater">블레이저 스웨터</option>
              <option value="CollarSweater">칼라 스웨터</option>
              <option value="GraphicShirt">그래픽 셔츠</option>
              <option value="Hoodie">후드</option>
              <option value="Overall">멜빵</option>
              <option value="ShirtCrewNeck">크루넥 셔츠</option>
              <option value="ShirtScoopNeck">스쿱넥 셔츠</option>
              <option value="ShirtVNeck">브이넥 셔츠</option>
            </select>
          </div>
          <div class="option-group">
            <label for="clotheColor">옷색</label>
            <select id="clotheColor" onchange="updateAvatar()">
              <option value="Black">검은색</option>
              <option value="Blue01">파란색1</option>
              <option value="Blue02">파란색2</option>
              <option value="Blue03">파란색3</option>
              <option value="Gray01">회색1</option>
              <option value="Gray02">회색2</option>
              <option value="Heather">히더</option>
              <option value="PastelBlue">파스텔 블루</option>
              <option value="PastelGreen">파스텔 그린</option>
              <option value="PastelOrange">파스텔 오렌지</option>
              <option value="PastelRed">파스텔 레드</option>
              <option value="PastelYellow">파스텔 옐로우</option>
              <option value="Pink">핑크</option>
              <option value="Red">빨간색</option>
              <option value="White">흰색</option>
            </select>
          </div>
          <div class="option-group">
            <label for="eyeType">눈</label>
            <select id="eyeType" onchange="updateAvatar()">
              <option value="Close">감은 눈</option>
              <option value="Cry">우는 눈</option>
              <option value="Default">기본</option>
              <option value="Dizzy">어지러운</option>
              <option value="EyeRoll">눈 굴림</option>
              <option value="Happy">행복한</option>
              <option value="Hearts">하트</option>
              <option value="Side">옆</option>
              <option value="Squint">찡그린</option>
              <option value="Surprised">놀란</option>
              <option value="Wink">윙크</option>
              <option value="WinkWacky">장난스러운 윙크</option>
            </select>
          </div>
          <div class="option-group">
            <label for="eyebrowType">눈썹</label>
            <select id="eyebrowType" onchange="updateAvatar()">
              <option value="Angry">화난</option>
              <option value="AngryNatural">자연스럽게 화난</option>
              <option value="Default">기본</option>
              <option value="DefaultNatural">자연스러운 기본</option>
              <option value="FlatNatural">자연스럽게 평평한</option>
              <option value="RaisedExcited">들뜬</option>
              <option value="RaisedExcitedNatural">자연스럽게 들뜬</option>
              <option value="SadConcerned">슬프고 걱정스러운</option>
              <option value="SadConcernedNatural">자연스럽게 슬프고 걱정스러운</option>
              <option value="UnibrowNatural">자연스러운 일자눈썹</option>
              <option value="UpDown">위아래</option>
              <option value="UpDownNatural">자연스럽게 위아래</option>
            </select>
          </div>
          <div class="option-group">
            <label for="mouthType">입</label>
            <select id="mouthType" onchange="updateAvatar()">
              <option value="Concerned">걱정스러운</option>
              <option value="Default">기본</option>
              <option value="Disbelief">불신</option>
              <option value="Eating">먹는</option>
              <option value="Grimace">찡그린</option>
              <option value="Sad">슬픈</option>
              <option value="ScreamOpen">소리지르는</option>
              <option value="Serious">진지한</option>
              <option value="Smile">웃는</option>
              <option value="Tongue">혀내민</option>
              <option value="Twinkle">반짝이는</option>
              <option value="Vomit">토하는</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 조회 페이지 -->
  <div id="searchPage" class="page">
        <div class="container">
            <h2>조회</h2>
            <div class="search-form">
        <div class="input-group">
                    <label for="searchName">이름</label>
          <input type="text" id="searchName" placeholder="이름을 입력하세요">
        </div>
        <div class="input-group">
                    <label for="searchTeam">팀명</label>
          <input type="text" id="searchTeam" placeholder="팀명을 입력하세요">
                </div>
                <button class="btn-primary" onclick="searchEmployee()">검색</button>
            </div>
            <div id="searchResults" class="search-results"></div>
            <div id="searchStatus" class="status"></div>
    </div>
  </div>

  <!-- 결과 페이지 -->
  <div id="resultPage" class="page">
        <div class="container">
            <div id="resultContainer"></div>
    </div>
  </div>

    <!-- React 라이브러리 (avataaars v2는 React 필요) -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <!-- Avataaars 라이브러리 -->
    <script src="https://unpkg.com/avataaars@2.0.0/dist/avataaars.js"></script>

  <!-- JavaScript -->
  <script src="js/data.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
