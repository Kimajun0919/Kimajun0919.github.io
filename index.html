<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>AR 가상 전시회</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Helvetica', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            color: white;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        #controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        
        .btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .btn.active {
            background: rgba(102, 126, 234, 0.8);
        }
        
        #info {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 2000;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            display: none;
            max-width: 400px;
        }
        
        #closeInfo {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h2>🎨 세계 여행 AR 전시회</h2>
        <p>카메라를 켜고 주변을 둘러보세요. 16개국의 아름다운 풍경을 만나보실 수 있습니다.</p>
    </div>

    <div id="controls">
        <button class="btn active" onclick="showGallery(1)">갤러리 1</button>
        <button class="btn" onclick="showGallery(2)">갤러리 2</button>
        <button class="btn" onclick="showInfo()">정보</button>
    </div>

    <div id="info">
        <button id="closeInfo" onclick="closeInfo()">×</button>
        <h3>AR 전시회 안내</h3>
        <p>이 전시회는 A-Frame과 AR.js를 사용하여 제작되었습니다.</p>
        <p>스마트폰에서 최적의 경험을 제공합니다.</p>
        <p>카메라 권한을 허용하고 주변을 천천히 둘러보세요.</p>
    </div>

    <a-scene 
        vr-mode-ui="enabled: false;" 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        gesture-detector
        id="scene">
        
        <!-- 갤러리 1: 아시아 지역 (8개) -->

                data-desc="일본의 상징적인 후지산의 아름다운 모습"
                gesture-handler>
            </a-image>
            <a-text 
                value="일본 - 후지산" 
                position="0 0.8 -4"

                color="#FFD700"

        </a-entity>

        <!-- 갤러리 2: 유럽/아메리카/아프리카 지역 (8개) -->

        <!-- 조명 -->
        <a-light type="ambient" intensity="0.8" color="#ffffff"></a-light>
        <a-light type="directional" position="2 4 5" intensity="0.5" color="#ffffff"></a-light>
        
        <!-- 배경 -->
        <a-sky color="#000011"></a-sky>
        
        <!-- 바닥 -->
        <a-plane 
            position="0 -1 -4" 
            rotation="-90 0 0" 
            width="20" 
            height="20" 
            color="#111111" 
            opacity="0.3">
        </a-plane>

        <!-- 카메라 -->
        <a-camera 
            gps-camera 
            rotation-reader
            wasd-controls="enabled: false"
            look-controls="enabled: true">
        </a-camera>
    </a-scene>

    <script>
        // 갤러리 전환
        function showGallery(num) {
            const gallery1 = document.getElementById('gallery1');
            const gallery2 = document.getElementById('gallery2');
            const buttons = document.querySelectorAll('.btn');
            
            // 버튼 스타일 업데이트
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (num === 1) {
                gallery1.setAttribute('visible', true);
                gallery2.setAttribute('visible', false);
            } else {
                gallery1.setAttribute('visible', false);
                gallery2.setAttribute('visible', true);
            }
        }

        // 정보창 표시
        function showInfo() {
            document.getElementById('info').style.display = 'block';
        }

        // 정보창 닫기
        function closeInfo() {
            document.getElementById('info').style.display = 'none';
        }

        // 제스처 감지 컴포넌트
        AFRAME.registerComponent('gesture-detector', {
            init: function () {
                this.el.addEventListener('click', function (evt) {
                    console.log('클릭됨:', evt.target);
                });
            }
        });

        // 작품 클릭 핸들러
        AFRAME.registerComponent('gesture-handler', {
            init: function () {
                this.el.addEventListener('click', (e) => {
                    const title = this.el.getAttribute('data-title');
                    const desc = this.el.getAttribute('data-desc');
                    
                    // 간단한 알림으로 작품 정보 표시
                    if (title && desc) {
                        alert(`🎨 ${title}\n\n${desc}`);
                    }
                    
                    // 클릭 효과 (크기 변화)
                    this.el.setAttribute('animation', 'property: scale; to: 1.1 1.1 1.1; dur: 200; dir: alternate; loop: 1');
                });
            }
        });

        // 페이지 로드 후 초기화
        window.addEventListener('load', function() {
            console.log('AR 전시회가 로드되었습니다!');
            
            // 3초 후 안내 메시지 업데이트
            setTimeout(() => {
                const ui = document.getElementById('ui');
                if (ui) {
                    ui.innerHTML = '<h2>🎨 세계 여행 AR 전시회</h2><p>작품을 클릭하면 상세 정보를 볼 수 있습니다!</p>';
                }
            }, 3000);
        });
    </script>
</body>
</html>
