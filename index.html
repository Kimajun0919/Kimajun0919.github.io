<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀원 관리 시스템</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- 메인 페이지 -->
  <div id="mainPage" class="page active">
        <div class="container">
            <h1>팀원 관리 시스템</h1>
        <div class="menu-buttons">
                <button class="menu-button" onclick="showPage('avatarPage')">아바타 생성</button>
          <button class="menu-button" onclick="showPage('searchPage')">조회</button>
        </div>
        </div>
    </div>

    <!-- 아바타 생성 페이지 -->
    <div id="avatarPage" class="page">
        <div class="avatar-container">
            <div class="avatar-header">
                <h2>팀원 아바타 생성</h2>
                <div class="avatar-actions">
                    <button class="btn-secondary" onclick="showPage('mainPage')">← 돌아가기</button>
                    <button class="btn-primary" onclick="saveAvatar()">아바타 저장</button>
                </div>
            </div>
            
            <div class="avatar-workspace">
                <!-- 아바타 미리보기 -->
                <div class="avatar-preview-section">
                    <div class="preview-container">
                        <div id="avatarPreview" class="avatar-preview">
                            <div class="avatar-placeholder">
                                <span>👤</span>
                                <p>아바타 미리보기</p>
      </div>
    </div>
  </div>

                    <!-- 사용자 정보 입력 -->
                    <div class="user-info">
        <div class="input-group">
                            <label for="avatarName">이름</label>
                            <input type="text" id="avatarName" placeholder="이름을 입력하세요">
        </div>
        <div class="input-group">
                            <label for="avatarTeam">팀명</label>
                            <input type="text" id="avatarTeam" placeholder="팀명을 입력하세요">
                        </div>
                    </div>
                </div>
                
                <!-- Avataaars 생성기 -->
                <div class="customization-panel">
                    <div class="avataaars-generator">
                        <div id="avataaarsContainer"></div>
                        <div class="generator-controls">
                            <button class="btn-secondary" onclick="randomizeAvatar()">🎲 랜덤 생성</button>
                            <button class="btn-primary" onclick="downloadAvatarSVG()">📥 SVG 다운로드</button>
        </div>
      </div>
                </div>
            </div>
            
            <div id="avatarStatus" class="status"></div>
    </div>
  </div>

  <!-- 조회 페이지 -->
  <div id="searchPage" class="page">
        <div class="container">
            <h2>직원 조회</h2>
            <div class="search-form">
        <div class="input-group">
                    <label for="searchName">이름</label>
          <input type="text" id="searchName" placeholder="이름을 입력하세요">
        </div>
        <div class="input-group">
                    <label for="searchTeam">팀명</label>
          <input type="text" id="searchTeam" placeholder="팀명을 입력하세요">
                </div>
                <button class="btn-primary" onclick="searchEmployee()">검색</button>
            </div>
            <div id="searchResults" class="search-results"></div>
            <div id="searchStatus" class="status"></div>
    </div>
  </div>

  <!-- 결과 페이지 -->
  <div id="resultPage" class="page">
        <div class="container">
            <div id="resultContainer"></div>
    </div>
  </div>

    <!-- Avataaars 라이브러리 -->
    <script src="https://unpkg.com/avataaars@2.0.0/dist/avataaars.js"></script>
    <!-- React 라이브러리 (avataaars v2는 React 필요) -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>

  <!-- JavaScript -->
  <script src="js/data.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
