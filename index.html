<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haneul Card : 하늘의 걸음</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- Adobe Fonts -->
  <script>
    (function(d) {
      var config = {
        kitId: 'wcb3eag',
        scriptTimeout: 3000,
        async: true
      },
      h=d.documentElement,t=setTimeout(function(){
        h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";
      },config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
      h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';
      tk.async=true;tk.onload=tk.onreadystatechange=function(){
        a=this.readyState;
        if(f||a&&a!="complete"&&a!="loaded")return;
        f=true;clearTimeout(t);
        try{Typekit.load(config)}catch(e){}
      };
      s.parentNode.insertBefore(tk,s)
    })(document);
  </script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- 메인 페이지 -->
  <div id="mainPage" class="page active">
    <div class="main-container">
      <div class="main-content">
        <h1 class="main-title">The Steps of Haneul</h1>
        <p class="main-subtitle">하늘의 걸음</p>
        <p class="bible-verse">
            선한 사람의 걸음을 여호와께서 정하시니<br>그분은 그 길을 기뻐하십니다.<br>
            <span class="bible-reference">시편 37편 23절</span>
        </p>
        <div class="menu-buttons">
          <button class="menu-button" onclick="showPage('registerPage')">등록</button>
          <button class="menu-button" onclick="showPage('avatarPage')">아바타 생성</button>
          <button class="menu-button test-button" onclick="showPage('testPage')">동시 업로드 테스트</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 등록 페이지 -->
  <div id="registerPage" class="page">
    <div class="register-container">
      <div class="register-card">
        <h2 class="register-title">팀원 등록</h2>
        <div class="input-group">
          <label class="input-label">이름</label>
          <input type="text" id="name" placeholder="이름을 입력하세요">
        </div>
        <div class="input-group">
          <label class="input-label">팀명</label>
          <input type="text" id="team" placeholder="팀명을 입력하세요">
        </div>
        <div class="input-group">
          <label class="input-label">사진</label>
          <div class="file-input-wrapper">
            <label for="photo" class="file-input-label" id="fileLabel">
              📷 사진을 선택하세요
            </label>
            <input type="file" id="photo" accept="image/*" onchange="previewImage(this)">
          </div>
          <img id="preview" class="preview-image" alt="미리보기">
        </div>
        <button class="action-button" onclick="registerEmployee()">등록하기</button>
        <button class="action-button secondary" onclick="showPage('mainPage')">돌아가기</button>
        <p id="status" class="status-message"></p>
      </div>
    </div>
  </div>

  <!-- 아바타 생성 페이지 -->
  <div id="avatarPage" class="page">
    <div class="search-container">
      <div class="search-card">
        <h2 class="register-title">아바타 생성</h2>
        <div class="input-group">
          <label class="input-label">이름</label>
          <input type="text" id="avatarName" placeholder="이름을 입력하세요">
        </div>
        <div class="input-group">
          <label class="input-label">팀명</label>
          <input type="text" id="avatarTeam" placeholder="팀명을 입력하세요">
        </div>
        <div class="character-customization">
          <div class="customization-section">
            <label class="customization-label">얼굴형</label>
            <div class="customization-options">
              <button class="option-btn" data-type="face" data-value="round" onclick="selectOption('face', 'round')">둥근형</button>
              <button class="option-btn" data-type="face" data-value="oval" onclick="selectOption('face', 'oval')">타원형</button>
              <button class="option-btn" data-type="face" data-value="square" onclick="selectOption('face', 'square')">각진형</button>
            </div>
          </div>
          
          <div class="customization-section">
            <label class="customization-label">눈</label>
            <div class="customization-options">
              <button class="option-btn" data-type="eyes" data-value="normal" onclick="selectOption('eyes', 'normal')">일반</button>
              <button class="option-btn" data-type="eyes" data-value="big" onclick="selectOption('eyes', 'big')">큰눈</button>
              <button class="option-btn" data-type="eyes" data-value="small" onclick="selectOption('eyes', 'small')">작은눈</button>
              <button class="option-btn" data-type="eyes" data-value="closed" onclick="selectOption('eyes', 'closed')">감은눈</button>
            </div>
          </div>
          
          <div class="customization-section">
            <label class="customization-label">코</label>
            <div class="customization-options">
              <button class="option-btn" data-type="nose" data-value="normal" onclick="selectOption('nose', 'normal')">일반</button>
              <button class="option-btn" data-type="nose" data-value="small" onclick="selectOption('nose', 'small')">작은코</button>
              <button class="option-btn" data-type="nose" data-value="big" onclick="selectOption('nose', 'big')">큰코</button>
            </div>
          </div>
          
          <div class="customization-section">
            <label class="customization-label">입</label>
            <div class="customization-options">
              <button class="option-btn" data-type="mouth" data-value="smile" onclick="selectOption('mouth', 'smile')">웃음</button>
              <button class="option-btn" data-type="mouth" data-value="normal" onclick="selectOption('mouth', 'normal')">일반</button>
              <button class="option-btn" data-type="mouth" data-value="surprised" onclick="selectOption('mouth', 'surprised')">놀람</button>
            </div>
          </div>
          
          <div class="customization-section">
            <label class="customization-label">머리스타일</label>
            <div class="customization-options">
              <button class="option-btn" data-type="hair" data-value="short" onclick="selectOption('hair', 'short')">짧은머리</button>
              <button class="option-btn" data-type="hair" data-value="long" onclick="selectOption('hair', 'long')">긴머리</button>
              <button class="option-btn" data-type="hair" data-value="curly" onclick="selectOption('hair', 'curly')">곱슬머리</button>
              <button class="option-btn" data-type="hair" data-value="bald" onclick="selectOption('hair', 'bald')">대머리</button>
            </div>
          </div>
          
          <div class="customization-section">
            <label class="customization-label">윗옷</label>
            <div class="customization-options">
              <button class="option-btn" data-type="shirt" data-value="t-shirt" onclick="selectOption('shirt', 't-shirt')">티셔츠</button>
              <button class="option-btn" data-type="shirt" data-value="shirt" onclick="selectOption('shirt', 'shirt')">셔츠</button>
              <button class="option-btn" data-type="shirt" data-value="hoodie" onclick="selectOption('shirt', 'hoodie')">후드</button>
              <button class="option-btn" data-type="shirt" data-value="dress" onclick="selectOption('shirt', 'dress')">드레스</button>
            </div>
          </div>
        </div>
        
        <div class="character-preview-container">
          <div class="character-preview" id="characterPreview">
            <div class="character-placeholder">캐릭터 미리보기</div>
          </div>
        </div>
        <button class="action-button" onclick="generateAvatar()">아바타 생성</button>
        <button class="action-button secondary" onclick="showPage('mainPage')">돌아가기</button>
        <p id="avatarStatus" class="status-message"></p>
      </div>
    </div>
  </div>

  <!-- 결과 페이지 -->
  <div id="resultPage" class="page">
    <div class="result-container" id="resultContainer">
      <div class="card-title">The Steps of Haneul</div>
      <div class="result-card" id="resultCard">
        <img id="resultPhoto" class="employee-photo" src="" alt="사원 사진">
        <div class="employee-name" id="resultName"></div>
        <div class="employee-team" id="resultTeam"></div>
        <div class="employee-id" id="resultId"></div>
      </div>
      <div class="button-container">
        <button class="result-button" onclick="saveAsImage()">이미지 저장</button>
        <button class="result-button" onclick="showPage('avatarPage')">아바타 생성</button>
        <button class="result-button" onclick="showPage('mainPage')">메인으로</button>
      </div>
    </div>
  </div>

  <!-- 테스트 페이지 -->
  <div id="testPage" class="page">
    <div class="register-container">
      <div class="register-card">
        <h2 class="register-title">동시 업로드 테스트</h2>
        <div class="test-info">
          <p>이 기능은 구글드라이브와 Firebase의 동시 접속 처리 능력을 테스트합니다.</p>
          <p><strong>주의:</strong> 테스트 데이터가 생성되며, 실제 데이터베이스에 저장됩니다.</p>
        </div>
        
        <div class="test-controls">
          <button class="action-button" onclick="startBulkUpload()">50개 샘플 데이터 업로드</button>
          <button class="action-button secondary" onclick="deleteTestData()">테스트 데이터 삭제</button>
          <button class="action-button secondary" onclick="showPage('mainPage')">돌아가기</button>
        </div>
        
        <div class="progress-container" id="progressContainer" style="display: none;">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-text" id="progressText">0 / 50</div>
          <div class="progress-status" id="progressStatus">준비 중...</div>
        </div>
        
        <div class="test-results" id="testResults">
          <div class="result-item">
            <span>성공:</span>
            <span id="successCount">0</span>
          </div>
          <div class="result-item">
            <span>실패:</span>
            <span id="failureCount">0</span>
          </div>
          <div class="result-item">
            <span>소요 시간:</span>
            <span id="elapsedTime">0초</span>
          </div>
        </div>
        
        <p id="testStatus" class="status-message"></p>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="js/data.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
