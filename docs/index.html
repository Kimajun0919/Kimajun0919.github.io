<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>무용 논문 RAG 시스템</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>무용 논문 검색</h1>
        <p class="subtitle">Dance Research Archive</p>
      </header>
      <main>
        <section id="upload-section">
          <h2>PDF 업로드</h2>
          <div class="input-group">
            <input type="file" multiple id="pdfUpload" accept="application/pdf" />
            <button id="uploadBtn">업로드</button>
          </div>
          <div id="uploadStatus" role="status" aria-live="polite"></div>
        </section>
        <section id="search-section">
          <h2>검색</h2>
          <div class="input-group">
            <input
              type="text"
              id="searchInput"
              placeholder="무용 이론, 안무, 움직임에 대해 질문해보세요..."
            />
            <button id="searchBtn">검색</button>
          </div>
        </section>
        <div id="result"></div>
      </main>
    </div>
    <script>
      window.__SUPABASE_FUNCTIONS_URL__ =
        window.__SUPABASE_FUNCTIONS_URL__ ??
        'https://kfjpzkizzkpdpdtzjgqg.supabase.co/functions/v1';
    </script>
    <script src="./src/api.js"></script>
    <script src="./src/upload.js"></script>
    <script src="./src/search.js"></script>
  </body>
</html>
