<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>무용 논문 RAG 시스템</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <!-- Vue나 React 없이 순수 JS로 조작하는 메인 컨테이너 -->
    <div id="app">
      <!-- 페이지 상단 제목과 소개 문구 -->
      <header>
        <h1>무용 논문 검색</h1>
        <p class="subtitle">Dance Research Archive</p>
      </header>
      <main>
        <!-- 사용자가 PDF를 업로드하는 영역 -->
        <section id="upload-section">
          <h2>PDF 업로드</h2>
          <div class="input-group">
            <input type="file" multiple id="pdfUpload" accept="application/pdf" />
            <button id="uploadBtn">업로드</button>
          </div>
          <div id="uploadStatus" role="status" aria-live="polite"></div>
        </section>
        <!-- 업로드된 논문을 질문으로 검색하는 영역 -->
        <section id="search-section">
          <h2>검색</h2>
          <div class="input-group">
            <input
              type="text"
              id="searchInput"
              placeholder="무용 이론, 안무, 움직임에 대해 질문해보세요..."
            />
            <button id="searchBtn">검색</button>
          </div>
        </section>
        <!-- 검색 결과 카드들을 렌더링하는 영역 -->
        <div id="result"></div>
        <!-- Supabase에 저장된 문서 목록을 보여주는 영역 -->
        <section id="library-section">
          <h2>업로드된 문서</h2>
          <button id="refreshLibraryBtn" type="button">목록 새로고침</button>
          <div id="libraryStatus" role="status" aria-live="polite"></div>
          <ul id="libraryList" class="document-list"></ul>
        </section>
      </main>
    </div>
    <!-- 구성 값 → API 클라이언트 → 업로드/검색/라이브러리 순으로 로드 -->
    <script src="./config.js"></script>
    <script src="./src/api.js"></script>
    <script src="./src/upload.js"></script>
    <script src="./src/search.js"></script>
    <script src="./src/library.js"></script>
  </body>
</html>
