<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="description" content="소중한 기도제목을 트리에 달아주세요" />
    <meta name="theme-color" content="#0a1628" />
    <!-- 성능 최적화 -->
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
    <title>기도제목 작성 - 크리스마스 기도 트리</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module">
      import { createPrayer } from "./firebase.js";

      window.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("form");
        const submitBtn = form.querySelector('button[type="submit"]');
        
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const content = form.content.value.trim();
          const author = form.author.value.trim();
          
          if (!content) {
            alert("기도제목을 입력해주세요.");
            return;
          }
          
          // 로딩 상태 표시
          submitBtn.disabled = true;
          submitBtn.classList.add('loading');
          const originalText = submitBtn.querySelector('.btn-text').textContent;
          submitBtn.querySelector('.btn-text').textContent = '전송 중...';
          
          try {
            await createPrayer({ content, author });
            submitBtn.querySelector('.btn-text').textContent = '완료!';
            setTimeout(() => {
              window.location.href = "view.html";
            }, 500);
          } catch (err) {
            console.error(err);
            alert("저장 중 문제가 발생했습니다. 다시 시도해주세요.");
            // 로딩 상태 해제
            submitBtn.disabled = false;
            submitBtn.classList.remove('loading');
            submitBtn.querySelector('.btn-text').textContent = originalText;
          }
        });
      });

      // 연결 상태 모니터링
      function updateOnlineStatus() {
        const indicator = document.getElementById('offline-indicator');
        if (!navigator.onLine) {
          if (!indicator) {
            const div = document.createElement('div');
            div.id = 'offline-indicator';
            div.className = 'offline-indicator show';
            div.textContent = '⚠️ 인터넷 연결이 끊어졌습니다';
            document.body.appendChild(div);
          }
        } else {
          if (indicator) {
            indicator.classList.remove('show');
            setTimeout(() => indicator.remove(), 300);
          }
        }
      }

      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      updateOnlineStatus();
    </script>
  </head>
  <body>
    <div class="main" style="max-width: 640px">
      <h2>기도제목 작성</h2>
      <p style="color: #e0e7ff; margin-bottom: 24px;">소중한 기도제목을 트리에 달아주세요</p>
      <form id="form">
        <label>기도제목 (필수)</label>
        <textarea name="content" rows="5" required placeholder="기도 제목을 남겨주세요..."></textarea>
        <label>작성자 (선택, 미입력 시 익명)</label>
        <input name="author" placeholder="이름 또는 닉네임" />
        <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 8px; font-size: 16px;">
          <span class="btn-icon">🙏</span>
          <span class="btn-text">전송하기</span>
        </button>
      </form>
      <div style="margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
        <a class="btn btn-secondary" href="index.html">
          <span class="btn-icon">🏠</span>
          <span class="btn-text">홈으로</span>
        </a>
        <a class="btn btn-accent" href="tree.html">
          <span class="btn-icon">🎄</span>
          <span class="btn-text">트리 보기</span>
        </a>
      </div>
    </div>
  </body>
</html>
