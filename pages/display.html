    <style>
      /* 전시용 추가 스타일 */
      body {
        overflow: hidden;
      }

      .display-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0;
        margin: 0;
      }

      .display-header {
        position: absolute;
        top: 40px;
        text-align: center;
        z-index: 100;
        animation: fadeIn 2s ease-in;
      }

      .display-header h1 {
        font-size: 4rem;
        margin: 0;
        padding: 0;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
      }

      .display-header p {
        font-size: 1.8rem;
        margin: 16px 0 0 0;
        color: #e0f2fe;
        opacity: 0.9;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }

      .display-tree-stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* 눈 내리는 효과 */
      @keyframes snowfall {
        0% {
          transform: translateY(-10px) translateX(0);
          opacity: 1;
        }
        100% {
          transform: translateY(100vh) translateX(50px);
          opacity: 0.3;
        }
      }

      .display-tree-stage::before,
      .display-tree-stage::after {
        content: '';
        position: absolute;
        top: -10px;
        width: 4px;
        height: 4px;
        background: white;
        border-radius: 50%;
        box-shadow: 
          50px 20px 0 -1px white,
          100px 60px 0 -1px white,
          150px 30px 0 -1px white,
          200px 80px 0 -1px white,
          250px 50px 0 -1px white,
          300px 90px 0 -1px white,
          350px 40px 0 -1px white,
          400px 70px 0 -1px white,
          450px 100px 0 -1px white,
          500px 60px 0 -1px white,
          550px 30px 0 -1px white,
          600px 80px 0 -1px white,
          650px 50px 0 -1px white,
          700px 90px 0 -1px white,
          750px 40px 0 -1px white,
          800px 70px 0 -1px white,
          850px 20px 0 -1px white,
          900px 60px 0 -1px white,
          950px 100px 0 -1px white,
          1000px 50px 0 -1px white,
          1050px 80px 0 -1px white,
          1100px 30px 0 -1px white,
          1150px 70px 0 -1px white,
          1200px 90px 0 -1px white,
          1250px 40px 0 -1px white,
          1300px 60px 0 -1px white,
          1350px 100px 0 -1px white,
          1400px 50px 0 -1px white,
          1450px 80px 0 -1px white,
          1500px 30px 0 -1px white;
        animation: snowfall 10s linear infinite;
        pointer-events: none;
        z-index: 50;
      }

      .display-tree-stage::after {
        animation-delay: 5s;
        animation-duration: 12s;
      }

      .display-tree-container {
        position: relative;
        width: 700px;
        height: auto;
        filter: drop-shadow(0 30px 80px rgba(16, 185, 129, 0.5)) 
                drop-shadow(0 0 60px rgba(255, 215, 0, 0.3));
        animation: treeGlowBig 4s ease-in-out infinite;
        z-index: 10;
      }

      @keyframes treeGlowBig {
        0%, 100% {
          filter: drop-shadow(0 30px 80px rgba(16, 185, 129, 0.5)) 
                  drop-shadow(0 0 60px rgba(255, 215, 0, 0.3));
          transform: scale(1);
        }
        50% {
          filter: drop-shadow(0 40px 100px rgba(16, 185, 129, 0.7)) 
                  drop-shadow(0 0 80px rgba(255, 215, 0, 0.5));
          transform: scale(1.02);
        }
      }

      .display-tree-container svg {
        width: 100%;
        height: auto;
        display: block;
      }

      .display-note {
        position: absolute;
        width: 240px;
        background: linear-gradient(135deg, 
          rgba(255, 255, 255, 0.12) 0%, 
          rgba(255, 255, 255, 0.08) 50%,
          rgba(255, 255, 255, 0.10) 100%);
        border: 2px solid rgba(189, 165, 104, 0.4);
        border-radius: 20px;
        padding: 28px;
        padding-top: 32px;
        color: #f0f9ff;
        backdrop-filter: blur(20px) saturate(150%);
        box-shadow: 
          0 16px 56px rgba(0, 0, 0, 0.4),
          0 6px 24px rgba(189, 165, 104, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
        transform: rotate(calc(-8deg + 16deg * var(--r)));
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        animation: floatIn 1.2s ease-out backwards;
        animation-delay: calc(var(--r) * 0.8s);
        overflow: visible;
        z-index: 20;
      }

      @keyframes floatIn {
        from {
          opacity: 0;
          transform: translateY(50px) rotate(calc(-8deg + 16deg * var(--r))) scale(0.8);
        }
        to {
          opacity: 1;
          transform: translateY(0) rotate(calc(-8deg + 16deg * var(--r))) scale(1);
        }
      }

      .display-note::before {
        content: '';
        position: absolute;
        top: 16px;
        left: 24px;
        right: 24px;
        height: 1px;
        background: linear-gradient(90deg, 
          transparent,
          rgba(189, 165, 104, 0.5) 20%,
          rgba(189, 165, 104, 0.5) 80%,
          transparent);
      }

      .display-note::after {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(135deg, 
          rgba(189, 165, 104, 0.3) 0%,
          rgba(212, 200, 150, 0.2) 50%,
          rgba(189, 165, 104, 0.3) 100%);
        border-radius: 20px;
        z-index: -1;
        opacity: 0.5;
      }

      .display-note-content {
        font-size: 18px;
        line-height: 1.7;
        color: #f0f9ff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        font-weight: 500;
        margin-bottom: 16px;
        margin-top: 4px;
      }

      .display-note-author {
        font-size: 15px;
        color: #cbd5e1;
        font-style: italic;
        opacity: 0.9;
        text-align: right;
        font-weight: 600;
      }

      .display-footer {
        position: absolute;
        bottom: 40px;
        text-align: center;
        z-index: 100;
        animation: fadeIn 2s ease-in 1s backwards;
      }

      .display-footer p {
        font-size: 1.4rem;
        color: #e0e7ff;
        opacity: 0.8;
        margin: 0;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      /* 로딩 상태 */
      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2rem;
        color: #e0e7ff;
        z-index: 200;
      }

      .loading::after {
        content: '...';
        animation: dots 1.5s steps(4, end) infinite;
      }

      @keyframes dots {
        0%, 20% { content: '.'; }
        40% { content: '..'; }
        60%, 100% { content: '...'; }
      }

      /* 자동 새로고침 인디케이터 */
      .refresh-indicator {
        position: absolute;
        top: 20px;
        right: 20px;
        padding: 12px 20px;
        background: rgba(16, 185, 129, 0.2);
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 12px;
        color: #10b981;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 100;
      }

      .refresh-indicator.show {
        opacity: 1;
      }

      @media screen and (max-width: 1024px) {
        .display-header h1 {

        .display-note {

        .display-note-content {

      @media screen and (max-width: 768px) {

        }

        .display-note-content {

      @media screen and (max-width: 480px) {

        }

        .refresh-indicator {

        }

      }

      @media screen and (max-width: 360px) {
        .display-header h1 {

        .display-note {

    <script type="module">
      import { listPrayers } from "../js/firebase.js";
      import { debounce } from "../js/utils.js";

      function placeNotesDisplay(container, items) {
        const { width, height } = container.getBoundingClientRect();
        const placed = [];
        const centerX = width / 2;
        const centerY = height / 2;

        // 반응형: 화면 크기에 따라 카드와 트리 영역 크기 조정
        let w = 240;
        let h = 180;
        let maxLength = 120;
        let treeWidth = 350;
        let treeHeight = 600;
        
        if (window.innerWidth <= 480) {
          w = 140;
          h = 140;
          maxLength = 60;
          treeWidth = 200;
          treeHeight = 400;
        } else if (window.innerWidth <= 768) {
          w = 160;
          h = 150;
          maxLength = 80;
          treeWidth = 250;
          treeHeight = 450;
        } else if (window.innerWidth <= 1024) {
          w = 200;
          h = 160;
          maxLength = 100;
          treeWidth = 300;
          treeHeight = 500;
        }

        // 트리 중심 영역 제외 (타원형)
        const isInTree = (x, y) => {
          const dx = (x + w/2 - centerX) / (treeWidth / 2);
          const dy = (y + h/2 - centerY) / (treeHeight / 2);
          return (dx * dx + dy * dy) < 1;
        };

        const isOverlap = (a, b) =>
          !(
            a.x + a.w < b.x ||
            b.x + b.w < a.x ||
            a.y + a.h < b.y ||
            b.y + b.h < a.y
          );

        items.forEach((item, index) => {
          const note = document.createElement("div");
          note.className = "display-note";
          note.style.setProperty("--r", Math.random().toFixed(2));
          
          const content = item.content.length > maxLength 
            ? item.content.slice(0, maxLength - 3) + "..." 
            : item.content;
          
          note.innerHTML = `
            <div class="display-note-content">${content}</div>
            <div class="display-note-author">- ${item.author || "익명"}</div>
          `;

          let tries = 0;
          let placed_flag = false;

          while (tries < 150 && !placed_flag) {
            const x = Math.random() * (width - w);
            const y = Math.random() * (height - h);
            const box = { x, y, w, h };
            
            if (!isInTree(x, y) && !placed.some((p) => isOverlap(p, box))) {
              placed.push(box);
              note.style.left = `${x}px`;
              note.style.top = `${y}px`;
              container.appendChild(note);
              placed_flag = true;
            }
            tries++;
          }
        });
      }

      async function loadAndDisplay() {
        const stage = document.querySelector(".display-tree-stage");
        const loading = document.querySelector(".loading");
        
        try {
          const prayers = await listPrayers();
          
          // 기존 노트들 제거
          document.querySelectorAll(".display-note").forEach(el => el.remove());
          
          // 최대 20개만 표시 (화면이 너무 복잡하지 않도록)
          const displayPrayers = prayers.slice(0, 20);
          placeNotesDisplay(stage, displayPrayers);
          
          if (loading) {
            loading.style.display = 'none';
          }
        } catch (e) {
          console.error(e);
          if (loading) {
            loading.textContent = "데이터를 불러올 수 없습니다";
          }
        }
      }

      // 자동 새로고침 (5분마다)
      function startAutoRefresh() {
        const indicator = document.querySelector('.refresh-indicator');
        
        setInterval(async () => {
          if (indicator) {
            indicator.classList.add('show');
          }
          
          await loadAndDisplay();
          
          setTimeout(() => {
            if (indicator) {
              indicator.classList.remove('show');
            }
          }, 2000);
        }, 5 * 60 * 1000); // 5분
      }

      window.addEventListener("DOMContentLoaded", async () => {
        await loadAndDisplay();
        startAutoRefresh();
      });

      // 반응형: 화면 크기 변경 시 재배치
      const handleResize = debounce(() => {
        loadAndDisplay();
      }, 300);
      window.addEventListener("resize", handleResize);

      // 풀스크린 토글 (F11 또는 'f' 키)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'f' || e.key === 'F') {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
          } else {
            document.exitFullscreen();
          }
        }
      });
    </script>
