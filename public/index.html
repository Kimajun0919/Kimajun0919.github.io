<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>무용 논문 RAG 시스템</title>
    <link rel="stylesheet" href="/styles/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>무용 논문 RAG 시스템</h1>
      </header>
      <main>
        <section id="upload-section">
          <h2>PDF 업로드</h2>
          <div class="input-group">
            <input type="file" multiple id="pdfUpload" accept="application/pdf" />
            <button id="uploadBtn">PDF 업로드</button>
          </div>
          <div id="uploadStatus" role="status" aria-live="polite"></div>
        </section>
        <section id="search-section">
          <h2>검색</h2>
          <div class="input-group">
            <input
              type="text"
              id="searchInput"
              placeholder="검색어 또는 질문을 입력하세요"
            />
            <button id="searchBtn">검색</button>
          </div>
        </section>
        <div id="result"></div>
      </main>
    </div>
    <script src="/src/api.js"></script>
    <script src="src/upload.js"></script>
    <script src="src/search.js"></script>
  </body>
</html>
